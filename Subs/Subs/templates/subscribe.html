<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg">
        <h1 class="text-3xl font-bold text-center text-gray-900">
            Subscribe to Our Newsletter
        </h1>

        <p class="text-center text-gray-600 mt-3 mb-8">
            Get the latest updates delivered straight to your inbox.
        </p>

        {% if message %}
            <div class="mb-6 rounded-lg border px-4 py-3 text-sm
                        {% if message_type == 'success' %} border-green-200 bg-green-50 text-green-700
                        {% elif message_type == 'warning' %} border-yellow-200 bg-yellow-50 text-yellow-700
                        {% else %} border-red-200 bg-red-50 text-red-700
                        {% endif %}">
                {{ message }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'subscribe' %}" class="space-y-5">
            {% csrf_token %}

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
            >
                Subscribe
            </button>
        </form>
    </div>
</body>
</html>
